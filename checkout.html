<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5f5f5, #e9e9e9);
  margin: 0;
  padding: 0;
}

.container {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  font-weight: normal;
  margin-bottom: 25px;
  color: #555;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  outline: none;
  transition: 0.3s;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  border-color: #ff3b3b;
  box-shadow: 0 0 8px rgba(255,59,59,0.2);
}

textarea {
  height: 100px;
  resize: none;
}

.btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #ff3b3b, #d60000);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  transition: 0.3s;
  margin-top: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(255,0,0,0.2);
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #333;
  text-decoration: none;
}

.back:hover {
  color: #ff3b3b;
}
</style>

</head>

<body>

<div class="container">

<h1>Check Out</h1>
<h2>Fill The Form To Confirm Your Order</h2>

<!-- FORM START -->
<form action="https://formsubmit.co/alibest1678@gmail.com" method="POST">

    <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>
    </div>

    <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="field">
        <label>Product Type</label>
        <select name="product_type" required>
            <option value="">Select Product</option>
            <option>Classic T-shirts</option>
            <option>Jeans</option>
            <option>Winter Jackets</option>
            <option>Red Sneakers</option>
            <option>Fashion Caps</option>
            <option>Formal Shirts</option>
            <option>Summer Dress</option>
            <option>Blazers</option>
            <option>Polo Shirts</option>
            <option>Leather Jackets</option>
        </select>
    </div>

    <div class="field">
        <label>City</label>
        <select name="city" required>
            <option value="">Select City</option>
            <option>Karachi</option>
            <option>Multan</option>
            <option>Peshawar</option>
        </select>
    </div>

    <div class="field">
        <label>Order Notes</label>
        <textarea name="feedback" placeholder="Write your feedback or order notes..." required></textarea>
    </div>

    <button class="btn" type="submit">Place Order</button>

</form>
<!-- FORM END -->

<a href="index.html" class="back">← Back to Home</a>

</div>

</body>
</html>
